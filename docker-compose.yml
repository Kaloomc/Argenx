# À coller dans Container Manager → Projet → Créer (voir docs/MISE-EN-LIGNE.md).
# Au démarrage : clone ou met à jour le dépôt GitHub, installe et lance le serveur.
# Pour déployer une nouvelle version : pousser sur GitHub, puis redémarrer le projet.
# Si la nouvelle version échoue aux tests (npm test), l'ancienne est remise et démarre à sa place.
# Les opérations sont gardées dans /docker/argenx/app/data (jamais envoyées sur GitHub).
services:
  argenx:
    image: node:20-alpine
    container_name: argenx
    restart: unless-stopped
    ports:
      - "3012:3012"
    environment:
      - PORT=3012
      - TZ=Europe/Paris
      # OBLIGATOIRE : mot de passe demandé une fois sur chaque téléphone.
      # Vide = l'appli refuse d'écouter sur le réseau (elle sera injoignable).
      - APP_PASSWORD=
      # Mêmes valeurs que Repax et Agendix : la page Notion commune, par laquelle les trois applis partagent leurs données
      # (vide = mode démo, pas d'envoi vers Notion ni de lien avec Repax)
      - NOTION_TOKEN=
      - NOTION_PAGE_ID=
      # Revolut en automatique (Enable Banking) : identifiant de l'application ; vide = pas de connexion.
      # La clé secrète va dans /docker/argenx/app/data/enablebanking.pem (jamais sur GitHub).
      - ENABLE_BANKING_APP_ID=
    volumes:
      - ./app:/app
    working_dir: /app
    command: >
      sh -c "apk add --no-cache git &&
             git config --global --add safe.directory /app &&
             if [ -d /app/.git ]; then
               AVANT=$$(git rev-parse HEAD);
               git fetch --depth 1 origin main && git reset --hard FETCH_HEAD;
               if ! (npm ci --omit=dev && NOTION_TOKEN= npm test); then
                 echo 'Nouvelle version en echec aux tests : retour a la precedente';
                 git reset --hard $$AVANT && npm ci --omit=dev;
               fi;
             else
               git clone --depth 1 https://github.com/Kaloomc/Argenx.git /app && npm ci --omit=dev;
             fi &&
             npm start"
